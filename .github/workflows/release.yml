# Builds the debug APK and publishes it as a GitHub release.
# Run it from the Actions tab ("Run workflow"), or push a tag like v2.3.0-build6.
name: Build APK release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build
        run: bash ./gradlew --no-daemon clean assembleDebug

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          code=$(grep -oP 'versionCode \K[0-9]+' app/build.gradle)
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"; else tag="v${name}-build${code}"; fi
          apk="rotorflight-blackbox-${name}-build${code}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          size=$(stat -c %s "$apk")
          sha=$(sha256sum "$apk" | cut -d' ' -f1)
          echo "APK: $apk, $size bytes, sha256 $sha" | tee -a "$GITHUB_STEP_SUMMARY"
          notes="Debug-signed build of commit ${GITHUB_SHA::7} (versionCode ${code}). Size ${size} bytes, SHA-256 ${sha}."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" --target "$GITHUB_SHA" --title "Rotorflight Blackbox ${name} (build ${code})" --notes "$notes"
          fi
