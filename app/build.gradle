plugins {
    id 'com.android.application'
}

android {
    namespace 'org.rotorflight.blackbox'
    compileSdk 34

    defaultConfig {
        applicationId "org.rotorflight.blackbox.android"
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName "2.3.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.8.0'
}
